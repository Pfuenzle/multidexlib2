plugins {
    id 'java-library'
    id 'maven-publish'
    id 'signing'
}

def dexlib2Version = '3.0.10'
def multidexlib2VersionSuffix = '.r3'

group = 'io.pfuenzle.dexweaver'
version = dexlib2Version + multidexlib2VersionSuffix

ext.mainArtifact = 'multidexlib2'
ext.artifactName = mainArtifact

sourceCompatibility = '1.8'

repositories {
    maven {
        url = 'https://dl.google.com/dl/android/maven2'
        metadataSources {
            mavenPom()
            artifact()
        }
    }
    mavenCentral()
}

dependencies {
    api 'com.android.tools.smali:smali-dexlib2:' + dexlib2Version
    api 'com.google.guava:guava:31.1-android'
    testImplementation 'junit:junit:4.13.2'
}

apply from: 'configure-artifacts.gradle'

apply from: 'configure-publishing.gradle'

publishing {
    publications {
        multidexlib2(MavenPublication) {
            artifactId = mainArtifact
            from components.java
            pom {
                name = artifactName
                configurePom it
            }
        }
    }
}

apply from: 'check-copyright.gradle'

if (project == rootProject) wrapper.distributionType = Wrapper.DistributionType.ALL
